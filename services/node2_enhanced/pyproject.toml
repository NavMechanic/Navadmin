[project]
name = "athena-node2"
version = "1.0.0"
description = "Project Athena — Node 2: Micro-PLM & Stage-Gate Governance"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers -p no:randomly"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
    "ignore:.*datetime.utcnow.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]   # FastAPI dependencies are function calls in defaults by design
