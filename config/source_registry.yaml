# ATHENA N0–N8 pre-training / grounding / evaluation source registry (SRC-001..SRC-075)
#
# STATUS: RECONSTRUCTED. The reference workbook
#   ATHENA_N0_N8_Pretraining_Data_Sources_and_Quality_Gateway_2026.xlsx
# was not available when this file was written. Entries marked PROMPT_SPECIFIED have their ID and
# guardrail fixed by the build specification; their URLs/licenses and every RECONSTRUCTED entry are
# best-effort and must be verified by the data steward (set catalog_status: VERIFIED once checked).
#
# The hard guardrails are NOT configurable here: data_pipeline/policy_gates.py hard-codes the
# non-commercial block (SRC-038/039), drop-zone-only sources, API-key live lookups and domain-boundary
# tags, and the loader refuses a catalog that contradicts them. Credentials are referenced as env vars
# only — never write a key into this file.
#
# intended_use → partition:  TRAIN-CANDIDATE → train_candidates   RAG/REFERENCE, LIVE-LOOKUP → rag_reference
#                            EVAL/BENCHMARK → eval_benchmarks (NC/unasserted → eval_noncommercial)
#                            PRIVATE-GROUND-TRUTH → private_ground_truth
version: 2026.1-reconstructed
